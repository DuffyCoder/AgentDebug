name: Feature request
description: Propose an improvement or a supported use case.
body:
  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: What are you trying to accomplish, and what is missing?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and alternatives
      description: Include API/CLI compatibility concerns where relevant.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: How could this be tested with synthetic data and without live model access?
